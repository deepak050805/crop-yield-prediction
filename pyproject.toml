[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
# Type checking is scoped to configuration and input validation at the CLI.
# pandas/scikit-learn stay integration-tested until a typed boundary is useful.
follow_imports = "silent"
