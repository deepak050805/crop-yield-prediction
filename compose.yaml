services:
  web:
    build: .
    image: fieldwise:local
    ports:
      - "${FIELDWISE_BIND_ADDRESS:-127.0.0.1}:${FIELDWISE_HOST_PORT:-10000}:10000"
    env_file:
      - path: .env
        required: false
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 35s
    restart: unless-stopped
