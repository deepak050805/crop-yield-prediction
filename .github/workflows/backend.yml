name: Backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint application and deployment tools
        run: python -m ruff check backend scripts
      - name: Type-check configuration and validation boundaries
        run: python -m mypy backend/config.py backend/validation.py
      - name: Run backend regression suite
        run: python -m unittest discover -s backend/tests -v
      - name: Run deployment-tool regression suite
        run: python -m unittest discover -s scripts/tests -v
